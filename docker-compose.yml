services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: packitbot
      POSTGRES_PASSWORD: packitbot
      POSTGRES_DB: packitbot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packitbot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Runs migrations first, then starts the bot if successful
    command: sh -c "alembic upgrade head && python -m bot.main"

volumes:
  postgres_data:
  redis_data: