[build-system]
requires = ["setuptools>=68.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "packitbot"
version = "0.1.0"
description = "Packitbot — CU delivery logistics bot"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
