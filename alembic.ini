[alembic]
script_location = alembic
# Intentionally left blank. The real URL is resolved at runtime by
# ``alembic/env.py`` from the application settings (``DATABASE_URL`` /
# ``bot.core.config.get_settings()``). Do not hardcode a DSN here: the
# previous placeholder ``driver://user:pass@localhost/dbname`` made
# ``alembic upgrade head --sql`` crash with NoSuchModuleError.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
